name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - name: Download dependencies
        run: go mod download

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Build
        run: go build -o bin/snyk-ignore .

      - name: Test CLI
        run: |
          ./bin/snyk-ignore --version
          ./bin/snyk-ignore --help
