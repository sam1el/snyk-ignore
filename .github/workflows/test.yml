name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Download dependencies
        run: go mod download

      - name: Tidy modules
        run: go mod tidy

      - name: Clean build cache
        run: go clean -testcache

      - name: Run tests with race detector
        run: go test ./... -v -race

      - name: Build
        run: go build -o bin/snyk-ignore .

      - name: Test CLI
        run: |
          ./bin/snyk-ignore --version
          ./bin/snyk-ignore --help
